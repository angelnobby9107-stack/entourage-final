<script>
function makeShim(room,host,key,uid){
  var es=null,liveCb=null,peerCb=null,lastLive,hasLive=false,lastPeers=null;
  function qs(){return"room="+room+"&key="+encodeURIComponent(key||"")+"&uid="+uid}
  function post(p,b){return fetch("/api/"+p+"?"+qs(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)})}
  function fire(){var v=lastLive;liveCb({exists:!!v,data:function(){return v}})}
  function conn(){if(es)return;es=new EventSource("/api/events?"+qs()+"&role="+(host?"host":"player"));
    es.addEventListener("live",function(e){lastLive=JSON.parse(e.data);hasLive=true;if(liveCb)fire()});
    es.addEventListener("peers",function(e){lastPeers=JSON.parse(e.data).map(function(p){return{isMe:false,kind:"viewer",by:p.uid,peer:p.uid,presence:p.presence}});if(peerCb)peerCb({peers:lastPeers})})}
  var mods={
    user:{canEdit:function(){return Promise.resolve(host)},id:function(){return Promise.resolve(uid)}},
    db:{doc:function(){return{set:function(o){return post("live",o)},onSnapshot:function(cb){liveCb=cb;conn();if(hasLive)fire()}}}},
    room:{presence:function(o){return post("presence",o)},onPeers:function(cb){peerCb=cb;conn();if(lastPeers)cb({peers:lastPeers})}},
    sample:{json:function(pr){return fetch("/api/sample?"+qs(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:pr})}).then(function(r){if(!r.ok)throw new Error("sample");return r.json()}).then(function(j){return j.value})}}
  };
  return{use:function(n){return Promise.resolve(mods[n]||null)}};
}
(function(){
  var g=document.getElementById("gate"),Q=new URLSearchParams(location.search),HK="entx_hostroom";
  function uid(){var u=localStorage.getItem("entx_uid");if(!u){u=Math.random().toString(36).slice(2,10);localStorage.setItem("entx_uid",u)}return u}
  function go(room,host,key){window.__room=room;window.claude=makeShim(room,host,key,uid());g.style.display="none";document.getElementById("app").style.display="";window.__start()}
  function api(p,o){return fetch(p,o).then(function(r){return r.json()})}
  function show(msg){
    var saved=null;try{saved=JSON.parse(localStorage.getItem(HK)||"null")}catch(e){}
    g.innerHTML='<div style="text-align:center;font-size:3rem;color:var(--gold)">☾</div><h1>Entourage</h1><div class="orn">✦ ❖ ✦</div><p class="sub">One Thousand and One Nights</p>'+(msg?'<p class="bear" style="text-align:center">'+msg+'</p>':'')+
    '<div class="card"><h2>Join a game</h2><input class="tin" id="jc" maxlength="4" placeholder="Room code" style="text-transform:uppercase;text-align:center;font-size:1.6rem;letter-spacing:.3em"><button class="primary" id="jb">Join</button></div>'+
    '<div class="card"><h2>Host a game</h2>'+(saved?'<button class="primary" id="rb" style="margin-bottom:8px">Resume room '+saved.room+'</button>':'')+'<button class="'+(saved?'':'primary')+'" id="hb" style="width:100%">Create a new room</button></div>';
    document.getElementById("jb").onclick=function(){join(document.getElementById("jc").value.trim().toUpperCase())};
    document.getElementById("hb").onclick=function(){api("/api/create",{method:"POST"}).then(function(r){localStorage.setItem(HK,JSON.stringify(r));go(r.room,true,r.key)}).catch(function(){show("Could not reach the server.")})};
    if(saved)document.getElementById("rb").onclick=function(){api("/api/room?code="+saved.room+"&key="+saved.key).then(function(r){if(r.ok)go(saved.room,true,saved.key);else{localStorage.removeItem(HK);show("That room has ended. Create a new one.")}})};
  }
  function join(c){if(c.length!==4){show("Enter the 4-letter room code.");return}
    api("/api/room?code="+c).then(function(r){if(r.ok)go(c,false,"");else show("Room not found.")}).catch(function(){show("Could not reach the server.")})}
  if(Q.get("r"))join(Q.get("r").toUpperCase());else show("");
})();
</script>

{n:"The Bazaar Riddles",s:"Tales of the market",t:45,acc:.6,how:"Eight riddles of valuation, derivatives and portfolio theory. A right answer earns 10 dinars; a wrong one costs 2."},

function gauss(){var u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function ma(a,n){var s=a.slice(-n),t=0;s.forEach(function(x){t+=x});return t/s.length}
function argmax(a){var b=0;a.forEach(function(v,i){if(v>a[b])b=i});return b}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){s=Math.max(s,0);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function gen(H,D){
  var P=[100],hs=[],i,prev=0,ph=Math.random()<.5?.3:-.3,flip=Math.floor(D/2)+(Math.random()<.5?0:1);
  for(i=1;i<H;i++){var r=ph*prev+gauss()*.013;P.push(P[i-1]*(1+r));prev=r}
  for(i=0;i<D;i++){
    if(i===flip)ph=-ph;
    var q=Math.random(),s=q<.4?1:q<.8?-1:0,r2=s*.009+ph*prev+gauss()*(.012+Math.abs(prev)*.4);
    P.push(P[P.length-1]*(1+r2));prev=r2;hs.push(Math.random()<.7?s:Math.floor(Math.random()*3)-1);
  }
  return{P:P,hs:hs};
}
function market(){
  var g=gen(20,8),P=g.P,ev=g.hs,H=20,D=8,i,out=[];
  for(i=0;i<D;i++){
    var x=H-1+i,hs=P.slice(0,x+1),m=(ma(hs,3)-ma(hs,10))/ma(hs,10),h=ev[i],sc=m*60+h*.8,ret=P[x+1]/P[x]-1;
    out.push({q:"Day "+(i+1)+": where does saffron go next?",o:["Long","Cash","Short"],p:[Math.round(ret*1000),0,Math.round(-ret*1000)],hd:pick(h>0?POS:h<0?NEG:NEU),ch:hs.slice(-H).map(function(v){return +v.toFixed(2)}),bot:sc>.5?0:sc<-.5?2:1,br:false,n:"Saffron moved "+(ret*100).toFixed(2)+"%. The Genie read momentum of "+(m*100).toFixed(1)+"% and a "+(h>0?"positive":h<0?"negative":"neutral")+" headline. Trends can reverse mid-game."});
  }

function hcost(it){return Math.max(2,Math.round(Math.max.apply(0,it.p)*.2))}
function withBot(items,acc){items.forEach(function(it){var b=argmax(it.p);if(it.o.length>2)it.hx=it.o.map(function(_,i){return i}).sort(function(a,c){return it.p[a]-it.p[c]||Math.random()-.5}).slice(0,2);it.bot=Math.random()<acc?b:Math.floor(Math.random()*it.o.length);it.br=Math.random()<.5});return items}

    var it=P.it,short=it.o.every(function(o){return o.length<=8}),best=it.best;

    h+=it.o.map(function(o,k){return '<button class="ob tbig'+(T.pk===k?" on":"")+(P.rev&&k===best?" ok":"")+'" data-a="tpick" data-o="'+k+'"'+(P.rev?" disabled":"")+'>'+esc(short?o:String.fromCharCode(65+k))+'</button>'}).join("");
    if(L.risk&&!P.rev)h+='<button class="ob rk tbig'+(T.rk?" on":"")+'" data-a="trisk">×2 Gamble</button>';
    if(it.ho&&P.hs&&!P.rev)h+=(T.hu&&it.hx)?'<p class="news">Hint: the answer is not '+it.hx.map(function(k){return esc(short?it.o[k]:String.fromCharCode(65+k))}).join(" or ")+'.</p>':'<button class="tbig" data-a="thint">💡 Use hint (−'+it.hc+' dinars)</button>';
    h+='</div>';
    if(P.rev){var d=P.dl[T.team]||0;h+='<div class="card"><h2>Best answer: '+esc(it.o[best])+'</h2><p style="margin:0 0 6px">'+esc(it.n)+'</p><b class="'+(d>=0?"bull":"bear")+'">You scored '+(d>0?"+":"")+d+'</b></div>';}
  }
  return h+lbT(P);
}
function teamAct(a,t,o){
  var T=API.T;
  if(a==="snd"){AU.on=!AU.on;saveSnd();render();return}
  if(!API.pub)return;
  if(a==="join"){T.team=t;try{localStorage.setItem("entx_team",String(t))}catch(e){}sendAns()}
  else if(a==="tpick"){if(!API.pub.rev){T.pk=(T.pk===o?-1:o);sendAns()}}
  else if(a==="trisk"){if(!API.pub.rev){T.rk=T.rk?0:1;sendAns()}}
  else if(a==="thint"){if(!API.pub.rev){T.hu=1;sendAns()}}
  render();
}
async function initSync(){
  try{
    var c=window.claude;if(!c||!c.use)return;
    var u=await c.use("user"),d=await c.use("db"),r=await c.use("room");
    if(!u||!d||!r)return;
    API.db=d;API.room=r;API.host=await u.canEdit();API.on=true;
    if(API.host){r.onPeers(function(ch){applyPeers(ch.peers)})}
    else{
      try{var v=parseInt(localStorage.getItem("entx_team"),10);if(v>=0&&v<8)API.T.team=v}catch(e){}
      d.doc("live/state").onSnapshot(function(sn){
        var P=sn.exists?sn.data():null,T=API.T;API.pub=P;
        if(P&&P.rev&&API.rk!==P.key){API.rk=P.key;gong()}
        if(P&&P.rs&&API.rsk!==P.key){API.rsk=P.key;gong()}
        if(P&&P.key&&T.key!==P.key){T.key=P.key;T.pk=-1;T.rk=0;T.hu=0;sendAns()}
        if(!(document.activeElement&&document.activeElement.tagName==="TEXTAREA"))render();
      },function(){});
      setInterval(function(){var P=API.pub,e=$("tmr");if(!P)return;var l=tleft(P);if(e)e.textContent=fmt(l);if(P.ph==="play"&&!P.rev&&P.tm&&P.tm.run&&API.ll!==l){API.ll=l;timeCue(l)}},1000);
    }
  }catch(e){}finally{API.ready=true;render()}
}
function doneV(){
  var a=S.sc.slice(0,8).map(function(s,i){return{i:i,s:s}}).sort(function(x,y){return y.s-x.s}),bs=S.sc[BOT],beat=a.filter(function(r){return r.s>bs}).length;
  return '<div class="wrap"><div><h1>The Sultan’s Verdict</h1><div class="orn">✦ ❖ ✦</div><p class="sub">Thank you for playing Entourage</p><div class="card">'+a.slice(0,3).map(function(r,k){return '<p style="font-size:1.3rem;margin:6px 0">'+["🥇","🥈","🥉"][k]+' <b>'+esc(S.tn[r.i])+'</b> · '+r.s+' dinars</p>'}).join("")+'</div><div class="card"><h2>Mortals vs the Genie</h2><p style="margin:0">'+(beat?beat+" of 8 caravans beat the Genie, who scored "+bs+" dinars.":"The Genie beat every caravan with "+bs+" dinars.")+'</p></div></div><aside>'+lb()+'</aside></div>';
}
function render(){
  var h;
  if(!API.ready){$("app").innerHTML='<p class="sub">Loading…</p>';return}
  if(API.on&&!API.host){$("app").innerHTML=teamV();return}
  if(!S)h=setupV();else if(S.ph==="intro")h=introV();else if(S.ph==="play")h=playV();else h=doneV();
  if(S)h+='<div class="foot"><button data-a="reset">'+(rs?"Tap again to erase this event":"New event")+'</button></div>';
  if(API.on)h='<p class="mute" style="margin:0 0 8px">Join code <b style="color:var(--gold);font-size:1.4em;letter-spacing:.2em">'+(window.__room||"")+'</b> · players open '+location.origin+'/?r='+(window.__room||"")+' · Caravans online · '+Object.keys(API.live).length+' of 8</p>'+h;
  h=sndBar()+h;
  $("app").innerHTML=h;if(S)save();pubState();
}
function stopT(){if(tm){clearInterval(tm);tm=null}left=LV[S?S.l:0].t}
function startEvent(){
  var n=[].map.call(document.querySelectorAll(".tin"),function(e,i){return e.value.trim()||"Team "+(i+1)});
  S={ph:"intro",tn:n,l:0,i:0,rev:false,pk:{},rk:{},dl:[],sc:[0,0,0,0,0,0,0,0,0],ls:[0,1,2,3,4,5].map(function(){return[0,0,0,0,0,0,0,0,0]}),plan:buildPlan(),ag:{tx:["","","","","","","",""],pc:[0,0,0,0,0,0,0,0],res:null,busy:false}};
}
function reveal(){
  gong();
  var L=LV[S.l],it=S.plan[S.l][S.i],best=argmax(it.p),t;S.dl=[];stopT();
  for(t=0;t<9;t++){
    var pk=t===BOT?it.bot:S.pk[t],rk=t===BOT?it.br:S.rk[t],d=0;
    if(pk!==undefined){d=it.p[pk];if(L.risk&&rk)d=pk===best?d*2:-10}
    if(t<8&&S.hu&&S.hu[t])d-=hcost(it);
    S.dl[t]=d;S.sc[t]+=d;S.ls[S.l][t]+=d;
  }
  S.rev=true;
}
function next(){
  var n=S.plan[S.l].length;S.rev=false;S.pk={};S.rk={};S.dl=[];S.hs=false;S.hu={};
  if(S.i<n-1)S.i++;else if(S.l<LV.length-1){S.l++;S.i=0;S.ph="intro"}else S.ph="done";
  stopT();
}
function timer(){
  if(tm){stopT();return}
  if(left<=0)left=LV[S.l].t;
  tm=setInterval(function(){left--;timeCue(left);var e=$("tmr");if(e){e.textContent=fmt(left);e.className=left<=5?"low":""}if(left<=0){clearInterval(tm);tm=null}},1000);
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),t=+b.getAttribute("data-t"),o=+b.getAttribute("data-o");
  ac();
  if(API.on&&!API.host){teamAct(a,t,o);return}
  if(a!=="reset")rs=false;
  if(a==="start")startEvent();
  else if(a==="begin"){S.ph="play";stopT()}
  else if(a==="pick"){if(S.pk[t]===o)delete S.pk[t];else S.pk[t]=o}
  else if(a==="risk"){S.rk[t]=!S.rk[t]}
  else if(a==="hint"){S.hs=true}
  else if(a==="hintuse"){S.hu=S.hu||{};S.hu[t]=!S.hu[t]}
  else if(a==="reveal")reveal();
  else if(a==="next")next();
  else if(a==="timer"){timer();var tb=$("tmr");if(tb){tb.textContent=fmt(left);tb.className=left<=5?"low":""}return}
  else if(a==="arena"){arena();return}
  else if(a==="craft"){S.ag.pc[t]=o}
  else if(a==="agfin")agfin();
  else if(a==="snd"){AU.on=!AU.on;saveSnd()}
  else if(a==="testg"){gong()}
  else if(a==="testl"){lute()}
  else if(a==="reset"){
    if(!rs){rs=true}else{rs=false;stopT();S=null;try{localStorage.removeItem(KEY)}catch(x){}}
  }
  render();
});
document.addEventListener("input",function(e){var x=e.target;if(x.getAttribute&&x.getAttribute("data-vol")!==null){AU.vol=x.value/100;saveSnd();return}
  if(API.on&&!API.host&&x.getAttribute&&x.getAttribute("data-tx2")!==null){API.T.tx=x.value;clearTimeout(API.tt);API.tt=setTimeout(sendAns,500);return}
  if(S&&x.getAttribute&&x.getAttribute("data-tx")!==null){S.ag.tx[+x.getAttribute("data-tx")]=x.value;save()}});
load();if(S){S.ag.busy=false;left=LV[S.l].t}render();initSync();setTimeout(function(){if(!API.ready){API.ready=true;render()}},4000);
};
</script>
</body>
